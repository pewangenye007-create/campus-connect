name: Build Campus Connect APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -q campus_connect_android_ready.zip
          mv campus_connect project

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable

      -      - name: Generate proper Android project
        working-directory: project
        run: flutter create --platforms=android --org com.campusconnect . name: Install dependencies
        working-directory: project
        run: flutter pub get

      - name: Build APK
        working-directory: project
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: campus-connect-apk
          path: project/build/app/outputs/flutter-apk/app-release.apk
