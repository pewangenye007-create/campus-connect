name: Build Campus Connect APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unzip source
        run: |
          unzip -q campus_connect_email_verification_fixed2.zip
          mv campus_connect source

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.2
          channel: stable

      - name: Create Android project
        run: flutter create --platforms=android --org com.campusconnect build_project

      - name: Fix Dart source
        run: |
          sed -i 's/child: const Card(child: Center(child: loading/child: Card(child: Center(child: loading/' source/lib/app.dart

      - name: Copy source
        run: |
          cp -r source/lib build_project/
          cp source/pubspec.yaml build_project/
          printf "SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n" "${{ secrets.SUPABASE_URL }}" "${{ secrets.SUPABASE_ANON_KEY }}" > build_project/.env

      - name: Add Internet permission
        run: |
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' build_project/android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        working-directory: build_project
        run: flutter pub get

      - name: Build APK
        working-directory: build_project
        run: flutter build apk --release --dart-define=dart.library.io.force_staggered_ipv6_lookup=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: campus-connect-apk
          path: build_project/build/app/outputs/flutter-apk/app-release.apk
